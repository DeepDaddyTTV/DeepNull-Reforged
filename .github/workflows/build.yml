name: Build

on: [push, pull_request]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace -PincludeJeiRuntime=false -PincludeMekanismRuntime=false -PincludeAe2Runtime=false

      - name: Run regression GameTests
        run: ./gradlew runGameTestServer --stacktrace -PincludeJeiRuntime=false -PincludeMekanismRuntime=false -PincludeAe2Runtime=false

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-base-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  optional-integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mekanism
            gradle_args: "-PincludeJeiRuntime=false -PincludeMekanismRuntime=true -PincludeAe2Runtime=false"
          - name: ae2-mekanism
            gradle_args: "-PincludeJeiRuntime=false -PincludeMekanismRuntime=true -PincludeAe2Runtime=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace ${{ matrix.gradle_args }}

      - name: Run regression GameTests
        run: ./gradlew runGameTestServer --stacktrace ${{ matrix.gradle_args }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-${{ matrix.name }}-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**
