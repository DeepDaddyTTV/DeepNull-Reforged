name: Build

on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run regression tests
        run: ./gradlew clean build --stacktrace

      - name: Upload regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-regression-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  smoke-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server smoke test
        env:
          DEEPNULL_CI_SMOKE_SERVER: "1"
        run: timeout 5m ./gradlew runServer --stacktrace --args='nogui'

      - name: Upload server smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-server-smoke-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  smoke-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify xvfb-run is available
        run: which xvfb-run

      - name: Run client title-screen smoke test
        env:
          DEEPNULL_CI_SMOKE_CLIENT: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        shell: bash
        run: |
          set -euo pipefail

          rm -f client-smoke.log
          rm -f run/logs/latest.log

          setsid xvfb-run -a ./gradlew runClient --stacktrace > client-smoke.log 2>&1 &
          client_pid=$!

          cleanup() {
            kill -TERM "-$client_pid" 2>/dev/null || true
            sleep 5
            kill -KILL "-$client_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          for _ in $(seq 1 300); do
            if grep -q "DeepNull Fabric CI smoke: client reached title screen" client-smoke.log 2>/dev/null || \
               grep -q "DeepNull Fabric CI smoke: client reached title screen" run/logs/latest.log 2>/dev/null; then
              echo "Client reached title screen."
              exit 0
            fi

            if ! kill -0 "$client_pid" 2>/dev/null; then
              if wait "$client_pid"; then
                echo "Client exited before reaching the title screen."
                exit 1
              else
                exit_code=$?
                echo "Client exited before reaching the title screen with code $exit_code."
                exit "$exit_code"
              fi
            fi

            sleep 1
          done

          echo "Client did not reach the title screen within 5 minutes."
          exit 1

      - name: Upload client smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-client-smoke-logs
          path: |
            client-smoke.log
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**
