name: Build

on: [push, pull_request]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace -PincludeJeiRuntime=true -PincludeMekanismRuntime=false -PincludeAe2Runtime=false

      - name: Run regression GameTests
        run: ./gradlew runGameTestServer --stacktrace -PincludeJeiRuntime=true -PincludeMekanismRuntime=false -PincludeAe2Runtime=false

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-base-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  optional-integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mekanism does not publish a Minecraft 26.1 artifact yet, so 26.1 CI can
          # only exercise the optional integrations that exist on this target today.
          - name: jei-ae2
            gradle_args: "-PincludeJeiRuntime=true -PincludeMekanismRuntime=false -PincludeAe2Runtime=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --stacktrace ${{ matrix.gradle_args }}

      - name: Check optional runtime compatibility
        id: runtime_compat
        shell: bash
        run: |
          can_run=true
          reason=

          ae2_jar=$(find ~/.gradle/caches/modules-2/files-2.1/org.appliedenergistics/appliedenergistics2 -name 'appliedenergistics2-*.jar' ! -name '*-api.jar' | sort | tail -n1)
          guideme_jar=$(find ~/.gradle/caches/modules-2/files-2.1/org.appliedenergistics/guideme -name 'guideme-*.jar' | sort | tail -n1)

          for jar in "$ae2_jar" "$guideme_jar"; do
            if [[ -z "$jar" ]]; then
              continue
            fi

            if unzip -p "$jar" META-INF/neoforge.mods.toml | grep -q '26.1-snapshot-'; then
              can_run=false
              reason="Published AE2/GuideME runtime artifacts still target Minecraft 26.1 snapshot builds instead of the 26.1 release."
              break
            fi
          done

          echo "can_run=$can_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Run regression GameTests
        if: steps.runtime_compat.outputs.can_run == 'true'
        run: ./gradlew runGameTestServer --stacktrace ${{ matrix.gradle_args }}

      - name: Skip runtime validation until upstream optional mods update
        if: steps.runtime_compat.outputs.can_run != 'true'
        run: echo "${{ steps.runtime_compat.outputs.reason }}"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-${{ matrix.name }}-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**
