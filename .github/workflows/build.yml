name: Build

on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run regression tests
        run: ./gradlew clean build --stacktrace

      - name: Upload regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-regression-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  smoke-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server smoke test
        env:
          DEEPNULL_CI_SMOKE_SERVER: "1"
        run: timeout 5m ./gradlew runServer --stacktrace --args='nogui'

      - name: Upload server smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-server-smoke-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**

  smoke-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify xvfb-run is available
        run: which xvfb-run

      - name: Run client title-screen smoke test
        env:
          DEEPNULL_CI_SMOKE_CLIENT: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 5m xvfb-run -a ./gradlew runClient --stacktrace

      - name: Upload client smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepnull-fabric-client-smoke-logs
          path: |
            run/logs/**
            logs/**
            crash-reports/**
            build/reports/**
            build/test-results/**
