plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = artifact_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def gameTestConfigDir = layout.projectDirectory.dir("run/gametest/config").asFile
def gameTestConfigFiles = fileTree(gameTestConfigDir) {
    include "deepnullreforged-common*.toml"
    include "deepnullreforged-server*.toml"
}.files

loom {
    runs {
        gameTestServer {
            inherit server
            configName = "DeepNull Fabric GameTest Server"
            runDir = "run/gametest"
            property "fabric-api.gametest"
            property "fabric-api.gametest.report-file", file("$buildDir/test-results/gametest/TEST-fabric-gametest.xml").absolutePath
            ideConfigGenerated false
        }
    }
}

def cleanDeepNullGameTestConfig = tasks.register("cleanDeepNullGameTestConfig", Delete) {
    delete gameTestConfigFiles
}

tasks.named("runGameTestServer").configure {
    dependsOn(cleanDeepNullGameTestConfig)
    doFirst {
        gameTestConfigDir.mkdirs()
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation(include("maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"))
    implementation(include("com.electronwill.night-config:core:${night_config_version}"))
    implementation(include("com.electronwill.night-config:toml:${night_config_version}"))
    implementation(include("teamreborn:energy:${team_reborn_energy_version}"))

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"
    testImplementation "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"

    testImplementation platform("org.junit:junit-bom:5.12.1")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.16.1"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            minecraft_version         : minecraft_version,
            minecraft_dependency_version: minecraft_dependency_version,
            loader_version            : loader_version,
            java_version              : java_version
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = artifact_name
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': artifact_name,
                'Specification-Title': artifact_name
        )
    }
}
