plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = artifact_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                deepnullreforged {
                    source sourceSets.main
                }
            }
        }

        client { }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            property 'deepnull.sourceResources', file('src/main/resources').absolutePath
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets {
    main {
        // The 1.21.1 implementation remains in-tree as the release reference.
        // Forge 1.16.5 compiles the API-specific port from this source root.
        java.srcDirs = ['src/legacy/java']
        resources { srcDir 'src/generated/resources' }
    }
    test {
        java.srcDirs = ['src/legacy/test']
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev/' }
}

def includeJeiRuntime = providers.gradleProperty('includeJeiRuntime').map(Boolean.&parseBoolean).orElse(false)
def includeAe2Runtime = providers.gradleProperty('includeAe2Runtime').map(Boolean.&parseBoolean).orElse(false)
def includeMekanismRuntime = providers.gradleProperty('includeMekanismRuntime').map(Boolean.&parseBoolean).orElse(false)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-1.16.5:${jei_version}:api")
    compileOnly fg.deobf("appeng:appliedenergistics2:${ae2_version}")
    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
    compileOnly 'org.jetbrains:annotations:24.1.0'

    if (includeJeiRuntime.get()) {
        localRuntime fg.deobf("mezz.jei:jei-1.16.5:${jei_version}")
    }
    if (includeAe2Runtime.get()) {
        localRuntime fg.deobf("appeng:appliedenergistics2:${ae2_version}")
    }
    if (includeMekanismRuntime.get()) {
        localRuntime fg.deobf("mekanism:Mekanism:${mekanism_version}")
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mekanism_version_range : mekanism_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xmaxwarns', '10000']
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title': artifact_name,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': artifact_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifactId = artifact_name
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
